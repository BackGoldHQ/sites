# PRODUCTION — ONE BUTTON. Run this workflow (Actions → Release → Run
# workflow, on main) to ship main's head to production: every template this
# repository owns (party, candidate, petition-drive, academy, nonprofit,
# unlabeled) as the Worker `template-<name>` in the Workers for Platforms
# dispatch namespace `sites-production`, which the production api Worker
# (backgold-api) binds as SITES (scripts/deploy-template.sh says how). Until
# a template has deployed once the namespace holds no script for it, and its
# sites answer 503 "This site isn't ready yet."
#
# CUTOVER SWITCH: every job runs only when the repository variable
# BACKGOLD_GITHUB_CI is 'on' (the `preflight` job checks it and every other
# job needs it).
#
# One job per template, independent of the others: a failed template deploy
# is re-run from its own job ("Re-run failed jobs") and the rest are
# unaffected. `concurrency: production` keeps one release running and at most
# one waiting. Each job carries `environment: production`: restrict that
# environment's deployment branches to `main`. The press is the approval.
#
# wrangler reads CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID from the
# environment (repository secrets, the BackGold account), and each template's
# KV namespace id from <TEMPLATE>_PRODUCTION_KV_ID (PARTY_PRODUCTION_KV_ID,
# ...), repository secrets passed through below: the production
# BACKGOLD_CACHE namespace's id, not the staging one's. The deploy jobs run on
# the `deploy` runners (long-lived; never an instance that can vanish
# mid-job).

name: Release

on:
  workflow_dispatch:

permissions:
  contents: read

# Every run: step is bash, not the sh -e GitHub uses in a container.
defaults:
  run:
    shell: bash

concurrency:
  group: production
  cancel-in-progress: false

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  preflight:
    name: Preflight
    if: vars.BACKGOLD_GITHUB_CI == 'on'
    runs-on: [self-hosted, docker]
    timeout-minutes: 2
    steps:
      - name: Releases ship main only
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "FAIL: a release ships main; this run was started on $GITHUB_REF"
            exit 1
          fi
          echo "Releasing $GITHUB_SHA to sites-production: one job per template this repository owns."

  deploy-production:
    name: Deploy ${{ matrix.template }} (production)
    needs: preflight
    runs-on: [self-hosted, docker, deploy]
    container:
      image: node:24
    environment: production
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        template: [party, candidate, petition-drive, academy, nonprofit, unlabeled]
    env:
      PARTY_PRODUCTION_KV_ID: ${{ secrets.PARTY_PRODUCTION_KV_ID }}
      CANDIDATE_PRODUCTION_KV_ID: ${{ secrets.CANDIDATE_PRODUCTION_KV_ID }}
      PETITION_DRIVE_PRODUCTION_KV_ID: ${{ secrets.PETITION_DRIVE_PRODUCTION_KV_ID }}
      ACADEMY_PRODUCTION_KV_ID: ${{ secrets.ACADEMY_PRODUCTION_KV_ID }}
      NONPROFIT_PRODUCTION_KV_ID: ${{ secrets.NONPROFIT_PRODUCTION_KV_ID }}
      UNLABELED_PRODUCTION_KV_ID: ${{ secrets.UNLABELED_PRODUCTION_KV_ID }}
    steps:
      - uses: actions/checkout@v4
      # The container runs as root over a workspace the runner's user owns;
      # without this every git command stops at "dubious ownership".
      - name: Trust the workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: pnpm store cache
        uses: actions/cache@v4
        with:
          path: .pnpm-store
          key: pnpm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-${{ runner.arch }}-
      - name: Install
        run: |
          corepack enable
          # Activates the exact pnpm from package.json's `packageManager` field.
          corepack prepare --activate
          pnpm config set store-dir .pnpm-store
          pnpm install --frozen-lockfile
      - run: bash scripts/deploy-template.sh production "${{ matrix.template }}"
