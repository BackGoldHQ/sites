# =========================================================================
# NPM — MANUAL ONLY. Publishes the two public packages to the npm registry,
# each through a pair of jobs:
#   pack-content → publish-content   @backgold/content (packages/content-client)
#   pack-astro   → publish-astro     @backgold/astro   (packages/astro-backgold)
# A person plays ONE job, the pack job, on a main pipeline; its publish job
# starts by itself when the pack job succeeds. With `sync-starter` they are
# the only jobs that put source in a public place. Nothing in this repository
# waits on a publish: the party template deploys from the workspace. A
# release is for outside users, the public starter among them.
#
# The pack job does everything that runs repository or dependency code:
# `pnpm install` (the default before_script, with dependency install
# scripts), builds what the package links against, the package's lint, build
# and test, then `pnpm pack` (which rewrites `workspace:` ranges to real
# ones). It refuses a version already on npm, a packed manifest that still
# names a `workspace:` range, and one that depends on an @backgold version npm
# does not have, so @backgold/astro never ships pointing at an unpublished
# client. Its only artifact is the tarball, kept for a day. It never uses the
# npm token; every read it makes of npm is anonymous.
#
# The publish job holds the token and runs no repository or dependency code:
# no checkout (GIT_STRATEGY none), no install, no cache, and only the pack
# job's tarball as input. It checks the token is set, writes an npmrc into
# its own temp dir holding the literal `${NPM_TOKEN}` reference (npm expands
# it when it sends a request, so the token never reaches disk), runs
# `npm whoami`, re-checks the version is not on npm, and runs
# `npm publish <tarball> --access public`. No line prints the token and
# nothing runs under `set -x`. Never commit an .npmrc.
#
# NPM_TOKEN is a masked, protected project variable holding a granular npm
# token with 2FA bypass, so only pipelines on main see it. The publish jobs
# declare the environment `npm` (action `access`: GitLab hands them variables
# scoped to `npm` but records no deployment, so the publish history stays in
# npm and in these job logs). Until the variable is scoped to that
# environment, every job of a main pipeline receives it; scoping it limits it
# to the two publish jobs, and both jobs work either way. GitLab's API needs
# the value to change a variable's scope, so the scope change is a second
# variable plus a delete, with the token piped in from the clipboard so it
# never sits on a command line (JHL, once, on a Mac with the token copied):
#   pbpaste | glab variable set NPM_TOKEN --scope npm --masked --protected -R backgold/sites && glab variable delete NPM_TOKEN --scope '*' -R backgold/sites
#
# REVISIT BEFORE JANUARY 2027: npm retires token publishing in early 2027
# (github.blog changelog, 2026-07-08). Its replacement, trusted publishing,
# accepts only GitLab.com-hosted runners, which this project does not use, so
# the release path has to change before then.
#
# To release: bump `version` in the package's package.json in an MR, merge,
# then play the pack job on that merge's pipeline. Publish @backgold/content
# first when @backgold/astro needs its new version. A version already on npm
# is refused up front, so re-running after a half-finished attempt stops with
# a message instead of a registry error.
# =========================================================================

.pack-npm:
  stage: deploy
  # A pack cancelled halfway leaves nothing to publish; one cancelled while
  # its publish job waits would strand a release. Never interrupt either.
  interruptible: false
  rules:
    - if: $CI_COMMIT_BRANCH == "main" && ($CI_PIPELINE_SOURCE == "push" || $CI_PIPELINE_SOURCE == "web")
      when: manual
  script:
    - |
      VERSION=$(node -p "require('./${PUBLISH_DIR}/package.json').version")
      # `npm view` prints the version when it exists, prints nothing when the
      # package exists without it, and exits non-zero when the package does not
      # exist yet (the first publish).
      PUBLISHED=$(npm view "${PUBLISH_PACKAGE}@${VERSION}" version 2>/dev/null || true)
      if [ "$PUBLISHED" = "$VERSION" ]; then
        echo "FAIL: ${PUBLISH_PACKAGE}@${VERSION} is already on npm. Bump the version in ${PUBLISH_DIR}/package.json in an MR, then publish from that merge's pipeline."
        exit 1
      fi
    - for dep in $PUBLISH_BUILD_FIRST; do pnpm --filter "$dep" build; done
    - pnpm --filter "$PUBLISH_PACKAGE" lint
    - pnpm --filter "$PUBLISH_PACKAGE" build
    - pnpm --filter "$PUBLISH_PACKAGE" test
    - |
      PACK_DIR="$CI_PROJECT_DIR/npm-tarball"
      rm -rf "$PACK_DIR"
      mkdir -p "$PACK_DIR"
      (cd "$PUBLISH_DIR" && pnpm pack --pack-destination "$PACK_DIR")
      TARBALL=$(ls "$PACK_DIR"/*.tgz)
      CHECK_DIR=$(mktemp -d)
      tar -xzOf "$TARBALL" package/package.json > "$CHECK_DIR/manifest.json"
      node -e '
        const m = require(process.argv[1]);
        const deps = { ...m.peerDependencies, ...m.optionalDependencies, ...m.dependencies };
        for (const [name, range] of Object.entries(deps)) console.log(name + " " + range);
      ' "$CHECK_DIR/manifest.json" > "$CHECK_DIR/deps.txt"
      while read -r name range; do
        case "$range" in
          workspace:*)
            echo "FAIL: the packed ${PUBLISH_PACKAGE} still depends on ${name}@${range}; pnpm pack should have rewritten it."
            exit 1
            ;;
        esac
        case "$name" in @backgold/*) ;; *) continue ;; esac
        if [ -z "$(npm view "${name}@${range}" version 2>/dev/null || true)" ]; then
          echo "FAIL: the packed ${PUBLISH_PACKAGE} depends on ${name}@${range}, which is not on npm. Publish ${name} first."
          exit 1
        fi
        echo "${name}@${range} resolves on npm"
      done < "$CHECK_DIR/deps.txt"
      echo "Packed ${PUBLISH_PACKAGE}@${VERSION} as $(basename "$TARBALL"); its publish job starts next."
  artifacts:
    paths:
      - npm-tarball/*.tgz
    expire_in: 1 day

.publish-npm:
  stage: deploy
  interruptible: false
  environment:
    name: npm
    action: access
  variables:
    GIT_STRATEGY: none
  before_script: []
  cache: []
  # No `when: manual`: the job waits on its pack job (`needs`, per job below)
  # and runs as soon as that one succeeds.
  rules:
    - if: $CI_COMMIT_BRANCH == "main" && ($CI_PIPELINE_SOURCE == "push" || $CI_PIPELINE_SOURCE == "web")
  script:
    - |
      if [ -z "${NPM_TOKEN:-}" ]; then
        echo "FAIL: NPM_TOKEN is empty. It is a protected variable, so only main pipelines see it, and only jobs in the npm environment when it is scoped there; check it under Settings > CI/CD > Variables."
        exit 1
      fi
      NPM_CONFIG_USERCONFIG="$(mktemp -d)/npmrc"
      export NPM_CONFIG_USERCONFIG
      printf '%s\n' '//registry.npmjs.org/:_authToken=${NPM_TOKEN}' > "$NPM_CONFIG_USERCONFIG"
    - npm --version
    - npm whoami
    - |
      # ./ in front: npm reads a bare `dir/file.tgz` as a GitHub `owner/repo`
      # shorthand and tries to clone it; a leading ./ makes it a file.
      set -- ./npm-tarball/*.tgz
      if [ "$#" != 1 ] || [ ! -f "$1" ]; then
        echo "FAIL: expected exactly one tarball from the pack job in npm-tarball/."
        exit 1
      fi
      TARBALL="$1"
      ID=$(tar -xzOf "$TARBALL" package/package.json | node -e '
        let s = "";
        process.stdin.on("data", (d) => (s += d)).on("end", () => {
          const m = JSON.parse(s);
          process.stdout.write(m.name + " " + m.version);
        });
      ')
      NAME=${ID% *}
      VERSION=${ID#* }
      if [ "$NAME" != "$PUBLISH_PACKAGE" ]; then
        echo "FAIL: the tarball is ${NAME}, not ${PUBLISH_PACKAGE}."
        exit 1
      fi
      PUBLISHED=$(npm view "${NAME}@${VERSION}" version 2>/dev/null || true)
      if [ "$PUBLISHED" = "$VERSION" ]; then
        echo "FAIL: ${NAME}@${VERSION} is already on npm."
        exit 1
      fi
      echo "Publishing ${NAME}@${VERSION} from $(basename "$TARBALL")"
      npm publish "$TARBALL" --access public

pack-content:
  extends: .pack-npm
  variables:
    PUBLISH_PACKAGE: "@backgold/content"
    PUBLISH_DIR: packages/content-client
    # Nothing to build first: the contract slice it bundles is plain files.

publish-content:
  extends: .publish-npm
  needs:
    - job: pack-content
      artifacts: true
  variables:
    PUBLISH_PACKAGE: "@backgold/content"

pack-astro:
  extends: .pack-npm
  variables:
    PUBLISH_PACKAGE: "@backgold/astro"
    PUBLISH_DIR: packages/astro-backgold
    # The client it depends on, through its dist.
    PUBLISH_BUILD_FIRST: "@backgold/content"

publish-astro:
  extends: .publish-npm
  needs:
    - job: pack-astro
      artifacts: true
  variables:
    PUBLISH_PACKAGE: "@backgold/astro"

# =========================================================================
# STARTER SYNC — templates/astro-starter → gitlab.com/backgold/backgold-starter
# (public), the repository Cloudflare's Deploy button clones, with the Astro
# starter as its root. AUTOMATIC on a main push that touched the template;
# MANUAL on every other main pipeline, so it can be re-run by hand (after
# publishing a package the template needs, or to restore a public repository
# someone edited). This job is the public repository's only writer.
#
# scripts/sync-starter.sh does the work. It always syncs main's NEWEST
# commit, whichever pipeline's job runs it: it fetches this repository's
# origin main (the job's shallow, detached checkout is fine) and takes the
# template from that commit, not from this pipeline's. Playing an older
# pipeline's job pushes the newest template or finds nothing to change, so it
# can never revert the public repository, and two merges landing close
# together both end with the newest template synced. It refuses to push
# unless the @backgold/astro and @backgold/content ranges the public
# template's package.json names resolve on npm (the public starter must
# always install, so publish first), replaces the public tree with the
# template as committed (deletions propagate, nothing outside the template is
# copied), commits as `BackGold <noreply@backgold.com>` with
# `Sync from backgold@<short sha of main's newest commit>`, and pushes to main
# as a plain fast-forward. Nothing changed, nothing pushed. A push rejected
# because the public main moved after the clone fails the job; re-run it.
#
# A starter range that is not on npm yet exits 3, which `allow_failure`
# turns into a warning: the merge that adds or bumps a template dependency
# leaves main yellow, not red, until the package is published; then play
# this job on any main pipeline. On the automatic run every other failure
# (main cannot be fetched, bad key, unreadable repository, a range npm
# cannot install at all, a rejected push) exits 1 and fails the job. A
# run played by hand is a manual job and, like every manual job here, never
# fails the pipeline; read its log.
#
# It pushes over SSH with the write deploy key on backgold/backgold-starter:
# STARTER_SYNC_KEY is a protected FILE variable (not masked: it is
# multi-line) holding the private half. The script pins gitlab.com's host
# keys rather than trusting a scan at run time, and ignores the image's
# system known_hosts and any ssh config. `resource_group` keeps two
# syncs from racing for the same branch.
# =========================================================================

sync-starter:
  stage: deploy
  interruptible: false
  resource_group: starter-sync
  allow_failure:
    exit_codes: [3]
  # git, ssh and npm come with node:24; nothing from the workspace is needed.
  cache: []
  before_script: []
  rules:
    # The job exists only while STARTER_SYNC_KEY is set on this project (it
    # is); this job is the public repository's only writer.
    # A package version bump changes the public package.json too (the sync
    # writes ^<version>), so it runs then as well: yellow until that version
    # is published, then played by hand.
    - if: $CI_COMMIT_BRANCH == "main" && $CI_PIPELINE_SOURCE == "push" && $STARTER_SYNC_KEY
      changes:
        - templates/astro-starter/**/*
        - packages/*/package.json
        - scripts/sync-starter.sh
    # A job-level allow_failure other than `true` would make this manual job
    # block the pipeline until played; the rule keeps it non-blocking.
    - if: $CI_COMMIT_BRANCH == "main" && ($CI_PIPELINE_SOURCE == "push" || $CI_PIPELINE_SOURCE == "web") && $STARTER_SYNC_KEY
      when: manual
      allow_failure: true
  script:
    - bash scripts/sync-starter.sh
