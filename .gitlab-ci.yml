# BackGold sites pipeline: the two public npm packages, the templates built on
# them, and the four templates' deploys (party, candidate, petition-drive,
# academy).
#
# Each check job is path-filtered, so an MR that only touches the starter never
# re-runs any template's e2e (the runners are shared with the platform's
# suites). GitLab evaluates `rules: changes:` against the MR diff natively;
# each job lists its own paths, what it consumes, and the root list.
#
# Fan-out map (a consumer resolves the packages through their built dist/, so
# each job builds what it consumes first):
#   packages/content-client → content-client   (@backgold/content on npm)
#                             + astro-backgold + template-kit + starter + every template
#                             deploy-<name>-staging on main (automatic)
#                             pack-content → publish-content (manual release)
#   packages/astro-backgold → astro-backgold   (@backgold/astro on npm)
#                             + template-kit + starter + every template
#                             deploy-<name>-staging on main (automatic)
#                             pack-astro → publish-astro (manual release)
#   packages/template-kit   → template-kit     (@backgold/template-kit, private:
#                                                what every template draws)
#                             + every template
#                             deploy-<name>-staging on main (automatic)
#   templates/astro-starter → starter          (the e2e, with
#                                                scripts/starter-e2e.mjs);
#                             sync-starter on main (automatic: mirrors it to
#                                                gitlab.com/backgold/backgold-starter)
#   templates/<name>        → <name>           (astro check, then the same e2e
#                                                with --template <name>), for
#                                                <name> = party, candidate,
#                                                petition-drive, academy; each extends
#                                                .template-check;
#                             deploy-<name>-staging on main (automatic: the
#                                                template into the sites-staging
#                                                dispatch namespace, built from
#                                                this workspace);
#                             deploy-<name>-production (manual on main: the same
#                                                into sites-production); both
#                                                extend .template-deploy-*
#   templates/*/template.json → manifests      (each manifest against the
#                                                vendored contract's schema)
#   scripts/starter-e2e.mjs → starter + every template
#   scripts/check-manifests.mjs → manifests
#   vendor/backgold-contract → manifests, and through the root list every
#                             check job (the Content API contract slice both packages
#                             bundle and the e2e's fixture api serves)
#   root config             → every check job (lockfile/workspace/vendor/this file)
#
# The templates deploy from this workspace on a push to main; they never
# wait on npm. Publishing the packages is a release for outside users (the
# public starter and their own sites), played by hand.
#
# CI/CD variables the main-branch jobs read (project-level, protected, so only
# main pipelines see them; masked unless noted):
#   CLOUDFLARE_API_TOKEN     every deploy-<name>-staging and -production job
#   CLOUDFLARE_ACCOUNT_ID    every deploy-<name>-staging and -production job
#   PARTY_STAGING_KV_ID, PARTY_PRODUCTION_KV_ID
#                            deploy-party-staging, deploy-production (-> deploy-*-production)
#   CANDIDATE_STAGING_KV_ID, CANDIDATE_PRODUCTION_KV_ID
#                            deploy-candidate-staging, deploy-candidate-production
#   PETITION_DRIVE_STAGING_KV_ID, PETITION_DRIVE_PRODUCTION_KV_ID
#                            deploy-petition-drive-staging, deploy-petition-drive-production
#   ACADEMY_STAGING_KV_ID, ACADEMY_PRODUCTION_KV_ID
#                            deploy-academy-staging, deploy-academy-production
#   NPM_TOKEN                publish-content, publish-astro
#   STARTER_SYNC_KEY         sync-starter (a FILE variable, not masked: it is
#                            a multi-line private key)
# All six are set on this project, which is the only repository that deploys
# template-party, publishes the packages and syncs the starter.
# ACADEMY_STAGING_KV_ID and ACADEMY_PRODUCTION_KV_ID are created with the
# academy's KV namespaces (templates/academy/README.md, Staging deploy);
# until then deploy-academy-staging stops with the sentence that names its
# variable. The
# deploy jobs exist only while CLOUDFLARE_API_TOKEN is set, and sync-starter
# only while STARTER_SYNC_KEY is; every job whose variable is unset stops
# with a sentence that names it before it does anything, so nothing deploys
# or publishes half-configured.
#
# Adding a package later: copy a check job, set its `changes:` to its own paths
# plus whatever it consumes plus the root list. Adding a template: copy the
# `party` check job and the two `deploy-party-*` jobs, naming the new template.
# The `gate` job needs no changes.

workflow:
  rules:
    # A pushed branch runs nothing until it has an open, ready MR: a push to a
    # branch with no MR is a `push` event and matches no rule below, and a
    # draft MR is dropped here. Marking an MR ready does not start a pipeline,
    # so whoever marks it ready runs one:
    # `glab mr update <iid> --ready && glab ci run --mr -b <branch>`.
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_DRAFT == "true"
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    # A main pipeline carries the deploy, so the next merge never cancels it:
    # jobs default to `interruptible: true` (right for MR checks), which would
    # otherwise let back-to-back merges cancel the only pipeline deploying the
    # party template. Deploys queue instead.
    - if: $CI_COMMIT_BRANCH == "main" && $CI_PIPELINE_SOURCE == "push"
      auto_cancel:
        on_new_commit: none
    # A main pipeline started by hand (Run pipeline in the UI, `glab ci run -b
    # main`) carries the manual deploy, release and sync jobs, so any of them
    # can be played without waiting for a push.
    - if: $CI_COMMIT_BRANCH == "main" && $CI_PIPELINE_SOURCE == "web"
      auto_cancel:
        on_new_commit: none

stages: [check, deploy]

default:
  image: node:24
  interruptible: true
  before_script: &pnpm_install
    - corepack enable
    # Activates the exact pnpm from package.json's `packageManager` field.
    - corepack prepare --activate
    - pnpm config set store-dir .pnpm-store
    - pnpm install --frozen-lockfile
  cache:
    key:
      files: [pnpm-lock.yaml]
    paths: [.pnpm-store]

# ---------------------------------------------------------------------------
# The root list: a change to any of these can alter every package's build.
# `changes:` lists do not merge through YAML anchors, so each job repeats its
# own full `changes:` block below; this anchor is used where the root list is
# the whole of it.
# ---------------------------------------------------------------------------
.root_changes: &root_changes
  - .gitlab-ci.yml
  - package.json
  - pnpm-lock.yaml
  - pnpm-workspace.yaml
  - vendor/**/*

# The e2e jobs' image: Microsoft's Playwright image (Ubuntu 24.04, node 24,
# its Chromium under /ms-playwright), pinned to the multi-arch index digest so
# amd64 and arm64 runners pull the same build. wrangler dev runs workerd,
# which needs glibc; Ubuntu has it. The Chromium's directory carries its
# revision and its architecture (chrome-linux64 on amd64, chrome-linux-arm64
# on arm64), so the job looks the executable up instead of naming it, and
# stops with a sentence when the image has none. A job-level before_script
# replaces the default one, so the pnpm bootstrap follows it here.
.e2e_before_script: &e2e_before_script
  - CHROME_BIN=$(ls -d /ms-playwright/chromium-*/chrome-linux*/chrome 2>/dev/null | head -n 1)
  - |
    if [ -z "$CHROME_BIN" ] || [ ! -x "$CHROME_BIN" ]; then
      echo "FAIL: no Chromium under /ms-playwright/chromium-*/ in this image; the e2e's Lighthouse run and the template look checks need one at CHROME_BIN." >&2
      exit 1
    fi
  - export CHROME_BIN
  - echo "CHROME_BIN=$CHROME_BIN"
  - *pnpm_install

# =========================================================================
# CHECK STAGE — runs on every ready MR.
# =========================================================================

# content-client = @backgold/content (packages/content-client), the public npm
# client for the headless Content API. Its response types come from the
# vendored contract slice and are bundled into its own declarations. `test`
# compiles to dist-test and runs node:test. A hang dies at 15 minutes and
# retries once; a real failure reds the job on the first run.
content-client:
  stage: check
  timeout: 15m
  retry:
    max: 1
    when:
      - job_execution_timeout
      - stuck_or_timeout_failure
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - packages/content-client/**/*
        - .gitlab-ci.yml
        - package.json
        - pnpm-lock.yaml
        - pnpm-workspace.yaml
        - vendor/**/*
  script:
    - pnpm --filter @backgold/content lint
    - pnpm --filter @backgold/content build
    - pnpm --filter @backgold/content test

# astro-backgold = @backgold/astro (packages/astro-backgold), the public npm
# package for an Astro site on Workers. It depends on @backgold/content
# through its built dist, so the client builds first; then its own lint (tsc),
# build and vitest. A client change re-runs it on the same MR. Same seatbelt
# as `content-client`.
astro-backgold:
  stage: check
  timeout: 15m
  retry:
    max: 1
    when:
      - job_execution_timeout
      - stuck_or_timeout_failure
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - packages/astro-backgold/**/*
        - packages/content-client/**/*
        - .gitlab-ci.yml
        - package.json
        - pnpm-lock.yaml
        - pnpm-workspace.yaml
        - vendor/**/*
  script:
    - pnpm --filter @backgold/content build
    - pnpm --filter @backgold/astro lint
    - pnpm --filter @backgold/astro build
    - pnpm --filter @backgold/astro test

# template-kit = @backgold/template-kit (packages/template-kit), the private
# workspace package every template's sections, entries, chrome, Site layout
# and routes come from, consumed as source. Its lint is `astro check` over
# its .astro files with its own astro.config.mjs, then `tsc` over its .ts and
# the integration; both read @backgold/astro's and @backgold/content's built
# types, so those build first. Same seatbelt as `content-client`.
template-kit:
  stage: check
  timeout: 15m
  retry:
    max: 1
    when:
      - job_execution_timeout
      - stuck_or_timeout_failure
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - packages/template-kit/**/*
        - packages/astro-backgold/**/*
        - packages/content-client/**/*
        - .gitlab-ci.yml
        - package.json
        - pnpm-lock.yaml
        - pnpm-workspace.yaml
        - vendor/**/*
  script:
    - pnpm --filter @backgold/content build
    - pnpm --filter @backgold/astro build
    - pnpm --filter @backgold/template-kit lint

# starter = the public starter (templates/astro-starter) end to end:
# scripts/starter-e2e.mjs packs both packages, installs them with npm into a
# copy of the template outside the repository (so nothing resolves through
# the workspace, as on a user's machine), builds it, serves it on
# `wrangler dev` against a fixture api and asserts the pages, the SEO routes
# and the webhook, then (`--lighthouse`) scores home and an entry page with
# Lighthouse and fails below 95 on performance, accessibility or SEO, in the
# image's Chromium at CHROME_BIN. The packages are built here first so their
# dist exists to pack. A hang dies at 20 minutes and retries once; a real
# failure reds the job on the first run.
#
# Runner architecture: the template copy's `npm install` takes workerd's
# platform binary (@cloudflare/workerd-linux-x64 or -arm64) as an optional
# dependency, and npm treats an optional dependency it fails to fetch as
# skippable: the install reports success and the build then stops with
# 'The package "@cloudflare/workerd-linux-arm64" could not be found'. On the
# arm64 Mac runner this is intermittent: a dropped download, not a missing
# platform; npm already includes optional dependencies by default and has no
# setting that makes their failure fatal. When it happens, retry the job.
# The job does not pin a runner: no runner tags exist to pin to.
starter:
  stage: check
  image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:7852dc5a7d72f5fe458a597d690f6c42fbc8e9e26ddfa95f8e6ef552558d9bbf
  timeout: 20m
  retry:
    max: 1
    when:
      - job_execution_timeout
      - stuck_or_timeout_failure
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - templates/astro-starter/**/*
        - scripts/starter-e2e.mjs
        - packages/astro-backgold/**/*
        - packages/content-client/**/*
        - .gitlab-ci.yml
        - package.json
        - pnpm-lock.yaml
        - pnpm-workspace.yaml
        - vendor/**/*
  before_script: *e2e_before_script
  script:
    - pnpm --filter @backgold/content build
    - pnpm --filter @backgold/astro build
    - node scripts/starter-e2e.mjs --lighthouse

# .template-check = the check every template runs, first `astro check` (the
# template's own `check` script) run in place from the workspace, where its
# @backgold dependencies resolve to the packages just built here; then the
# same end-to-end checks as `starter`: scripts/starter-e2e.mjs with
# `--template <name>` copies templates/<name> in place of the starter and runs
# every check, Lighthouse and the template's look checks in Chromium included.
# Same image, timeout, retry and runner note as `starter`. A job extends it,
# sets TEMPLATE to its directory name and lists its own `rules:` (a `changes:`
# list cannot be inherited): its own paths, packages/template-kit, the e2e
# script, both packages and the root list.
.template-check:
  stage: check
  image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:7852dc5a7d72f5fe458a597d690f6c42fbc8e9e26ddfa95f8e6ef552558d9bbf
  timeout: 20m
  retry:
    max: 1
    when:
      - job_execution_timeout
      - stuck_or_timeout_failure
  before_script: *e2e_before_script
  script:
    - pnpm --filter @backgold/content build
    - pnpm --filter @backgold/astro build
    - pnpm --filter "backgold-template-$TEMPLATE" exec astro check
    - node scripts/starter-e2e.mjs --template "$TEMPLATE" --lighthouse

# party = the party template (templates/party), drawn by the template kit
# (packages/template-kit).
party:
  extends: .template-check
  variables:
    TEMPLATE: party
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - templates/party/**/*
        - packages/template-kit/**/*
        - scripts/starter-e2e.mjs
        - packages/astro-backgold/**/*
        - packages/content-client/**/*
        - .gitlab-ci.yml
        - package.json
        - pnpm-lock.yaml
        - pnpm-workspace.yaml
        - vendor/**/*

# candidate = the candidate template (templates/candidate), on the kit.
candidate:
  extends: .template-check
  variables:
    TEMPLATE: candidate
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - templates/candidate/**/*
        - packages/template-kit/**/*
        - scripts/starter-e2e.mjs
        - packages/astro-backgold/**/*
        - packages/content-client/**/*
        - .gitlab-ci.yml
        - package.json
        - pnpm-lock.yaml
        - pnpm-workspace.yaml
        - vendor/**/*

# petition-drive = the petition-drive template (templates/petition-drive), on
# the kit.
petition-drive:
  extends: .template-check
  variables:
    TEMPLATE: petition-drive
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - templates/petition-drive/**/*
        - packages/template-kit/**/*
        - scripts/starter-e2e.mjs
        - packages/astro-backgold/**/*
        - packages/content-client/**/*
        - .gitlab-ci.yml
        - package.json
        - pnpm-lock.yaml
        - pnpm-workspace.yaml
        - vendor/**/*

# academy = the academy template (templates/academy), on the kit.
academy:
  extends: .template-check
  variables:
    TEMPLATE: academy
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - templates/academy/**/*
        - packages/template-kit/**/*
        - scripts/starter-e2e.mjs
        - packages/astro-backgold/**/*
        - packages/content-client/**/*
        - .gitlab-ci.yml
        - package.json
        - pnpm-lock.yaml
        - pnpm-workspace.yaml
        - vendor/**/*

# manifests = every templates/<dir>/template.json against
# siteTemplateManifestSchema from the vendored contract slice, and each
# manifest's key against its directory (scripts/check-manifests.mjs). The
# platform keeps a copy of each manifest and checks it with the same schema,
# so a manifest that passes here is one the platform can take. The install is
# for the slice's own import of zod.
manifests:
  stage: check
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - templates/*/template.json
        - vendor/backgold-contract/**/*
        - scripts/check-manifests.mjs
        - .gitlab-ci.yml
        - package.json
        - pnpm-lock.yaml
        - pnpm-workspace.yaml
        - vendor/**/*
  script:
    - node scripts/check-manifests.mjs

# Always-on gate. With every real job path-filtered, an MR that touches only
# docs would otherwise produce a pipeline with no jobs, and "pipelines must
# succeed" blocks merging when no pipeline exists. This guarantees exactly one
# cheap, always-green status per pipeline; a failed sibling job still fails
# the pipeline as a whole.
gate:
  stage: check
  cache: []
  before_script: []
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main" && ($CI_PIPELINE_SOURCE == "push" || $CI_PIPELINE_SOURCE == "web")
  script:
    - echo "pipeline present — check jobs run only for changed paths"

# =========================================================================
# =========================================================================
# TEMPLATE DEPLOYS. The MR already ran the checks, so the deploys build
# straight off the push rather than re-running them. wrangler reads
# CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID from the environment. Each
# template (party, candidate, petition-drive, academy) has a staging and a production
# job, shaped by the two hidden jobs below.
# =========================================================================

# .template-deploy-staging: templates/<name> as the Worker `template-<name>`
# in the Workers for Platforms dispatch namespace `sites-staging`. The staging
# api Worker (givegold-api-staging) answers every *.backgold.dev host and
# dispatches each request for a site on the template to that Worker with the
# site's id in X-BackGold-Site; the Worker reads the Content API first-party,
# through a service binding to the api's FirstParty entrypoint. One deploy
# serves every site on the template on staging (the Westmark Liberty Party demo,
# westmark.backgold.dev, is on party). A namespace Worker has no routes or
# Custom Domain, so the deploy touches no DNS. A concrete job is AUTOMATIC on a
# main push that changed its template, a package, the vendored contract, the
# lockfile or this file; MANUAL and never blocking on every other main
# pipeline, to redeploy by hand. It deploys the template as committed in the
# pipeline it runs in, so play it by hand on the newest main pipeline.
# Content changes never need it: a publish bumps the site's content version,
# the client notices within its one-minute version check, and a new version
# is a miss in the site's cache.
#
# It builds from this workspace: the default before_script installs it, the
# two packages build to their dist, and the template's @backgold dependencies
# resolve to them, so the deploy carries the packages as committed here,
# never what is on npm.
#
# The staging environment of templates/<name>/wrangler.jsonc holds the name,
# the BACKGOLD_API service binding, BACKGOLD_API_ORIGIN and the cache's KV
# binding. The Cloudflare adapter writes the deploy config
# (dist/server/wrangler.json) during `astro build`, choosing the environment
# from CLOUDFLARE_ENV then; `wrangler deploy` reads that file, so a `--env`
# given only at deploy time would be ignored and the default config (Worker
# `backgold-<name>`) deployed. The job therefore builds with
# CLOUDFLARE_ENV=staging and refuses to deploy unless the built config names
# template-<name>. Before building it reads the namespace and stops with a
# sentence when it does not exist (wrangler's code 100119): creating it is a
# one-time account step (templates/<name>/README.md, Staging deploy).
#
# A concrete job extends this, sets TEMPLATE (the directory name) and KV_VAR,
# and lists its own `rules:` (a `changes:` list cannot be inherited). KV_VAR
# names the required CI variable, <NAME>_STAGING_KV_ID: the id of the
# BACKGOLD_CACHE KV namespace, created once by hand. Wrangler reads no
# environment variable in a config, so the job writes it over the
# __<NAME>_STAGING_KV_ID__ placeholder in wrangler.jsonc before the build.
# No site key and no secrets: a first-party read needs no key (the site comes
# from X-BackGold-Site, drafts for /preview included), and the api keeps
# /api/* on every site host, so the template's webhook route is never reached.
.template-deploy-staging:
  stage: deploy
  environment: staging
  interruptible: false
  script:
    - |
      set -euo pipefail
      namespace=sites-staging
      for var in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do
        if [ -z "${!var:-}" ]; then
          echo "FAIL: $var is not set; it is a protected variable on this project (Settings > CI/CD > Variables), so only main pipelines see it. Not deploying." >&2
          exit 1
        fi
      done
      kv_id="${!KV_VAR:-}"
      if ! printf '%s' "$kv_id" | grep -Eq '^[0-9a-f]{32}$'; then
        echo "FAIL: $KV_VAR must be the BACKGOLD_CACHE namespace's 32-character id. Create the namespace once (templates/$TEMPLATE/README.md, Staging deploy) and set the variable." >&2
        exit 1
      fi
      sed -i "s/__${KV_VAR}__/$kv_id/" "templates/$TEMPLATE/wrangler.jsonc"
      if ! grep -q "\"id\": \"$kv_id\"" "templates/$TEMPLATE/wrangler.jsonc"; then
        echo "FAIL: templates/$TEMPLATE/wrangler.jsonc has no __${KV_VAR}__ placeholder in its staging kv_namespaces; not deploying." >&2
        exit 1
      fi
      if ! ns_out=$(pnpm --filter "backgold-template-$TEMPLATE" exec wrangler dispatch-namespace get "$namespace" 2>&1); then
        if printf '%s' "$ns_out" | grep -q 'code: 100119'; then
          echo "FAIL: the dispatch namespace $namespace does not exist on this account. Create it once (templates/$TEMPLATE/README.md, Staging deploy), then play the job again." >&2
        else
          printf '%s\n' "$ns_out" >&2
          echo "FAIL: could not read the dispatch namespace $namespace (wrangler's error above); not deploying." >&2
        fi
        exit 1
      fi
      pnpm --filter @backgold/content build
      pnpm --filter @backgold/astro build
      CLOUDFLARE_ENV=staging pnpm --filter "backgold-template-$TEMPLATE" build
      built=$(node -p "require('./templates/$TEMPLATE/dist/server/wrangler.json').name")
      if [ "$built" != "template-$TEMPLATE" ]; then
        echo "FAIL: the build wrote a deploy config for '$built', not template-$TEMPLATE; not deploying." >&2
        exit 1
      fi
      pnpm --filter "backgold-template-$TEMPLATE" exec wrangler deploy --dispatch-namespace "$namespace"

# .template-deploy-production: the same template as the Worker
# `template-<name>` in the Workers for Platforms dispatch namespace
# `sites-production`, which the production api Worker (backgold-api) binds as
# SITES. That api answers every *.backgold.com host and each verified tenant
# custom domain, and dispatches each request for a site on the template to this
# Worker with the site's id in X-BackGold-Site; the Worker reads the Content API
# first-party through a service binding to backgold-api's FirstParty
# entrypoint. One deploy serves every site on the template in production. Until
# a template's job has run once the namespace holds no script for it, and those
# sites answer 503 "This site isn't ready yet." MANUAL ONLY on every main
# pipeline and never blocking (`allow_failure: true`, so an unplayed deploy
# never holds the pipeline); it deploys the template as committed in the
# pipeline it is played from, so play it on the newest main pipeline. It exists
# only once CLOUDFLARE_API_TOKEN is set, as the staging jobs.
#
# The script is .template-deploy-staging's with the environment names changed:
# the namespace (sites-production), the CI variable (KV_VAR is
# <NAME>_PRODUCTION_KV_ID, written over __<NAME>_PRODUCTION_KV_ID__ in the
# `production` environment of templates/<name>/wrangler.jsonc, and it is the
# production BACKGOLD_CACHE namespace's id, not the staging one's),
# CLOUDFLARE_ENV=production for the build, the GitLab environment, and the
# README pointer (Production deploy). See the staging job's note for why it
# builds from the workspace, why the build, not the deploy, chooses the
# environment, and why the job stops before building when the namespace is
# missing. No site key and no secrets, as for staging.
.template-deploy-production:
  stage: deploy
  environment: production
  interruptible: false
  # Runs by itself once `deploy-production` (the one button an operator plays)
  # has succeeded on the same pipeline; it is never played on its own.
  needs:
    - job: deploy-production
  rules:
    - if: $CI_COMMIT_BRANCH == "main" && ($CI_PIPELINE_SOURCE == "push" || $CI_PIPELINE_SOURCE == "web") && $CLOUDFLARE_API_TOKEN
  script:
    - |
      set -euo pipefail
      namespace=sites-production
      for var in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do
        if [ -z "${!var:-}" ]; then
          echo "FAIL: $var is not set; it is a protected variable on this project (Settings > CI/CD > Variables), so only main pipelines see it. Not deploying." >&2
          exit 1
        fi
      done
      kv_id="${!KV_VAR:-}"
      if ! printf '%s' "$kv_id" | grep -Eq '^[0-9a-f]{32}$'; then
        echo "FAIL: $KV_VAR must be the BACKGOLD_CACHE namespace's 32-character id. Create the namespace once (templates/$TEMPLATE/README.md, Production deploy) and set the variable." >&2
        exit 1
      fi
      sed -i "s/__${KV_VAR}__/$kv_id/" "templates/$TEMPLATE/wrangler.jsonc"
      if ! grep -q "\"id\": \"$kv_id\"" "templates/$TEMPLATE/wrangler.jsonc"; then
        echo "FAIL: templates/$TEMPLATE/wrangler.jsonc has no __${KV_VAR}__ placeholder in its production kv_namespaces; not deploying." >&2
        exit 1
      fi
      if ! ns_out=$(pnpm --filter "backgold-template-$TEMPLATE" exec wrangler dispatch-namespace get "$namespace" 2>&1); then
        if printf '%s' "$ns_out" | grep -q 'code: 100119'; then
          echo "FAIL: the dispatch namespace $namespace does not exist on this account. Create it once (templates/$TEMPLATE/README.md, Production deploy), then play the job again." >&2
        else
          printf '%s\n' "$ns_out" >&2
          echo "FAIL: could not read the dispatch namespace $namespace (wrangler's error above); not deploying." >&2
        fi
        exit 1
      fi
      pnpm --filter @backgold/content build
      pnpm --filter @backgold/astro build
      CLOUDFLARE_ENV=production pnpm --filter "backgold-template-$TEMPLATE" build
      built=$(node -p "require('./templates/$TEMPLATE/dist/server/wrangler.json').name")
      if [ "$built" != "template-$TEMPLATE" ]; then
        echo "FAIL: the build wrote a deploy config for '$built', not template-$TEMPLATE; not deploying." >&2
        exit 1
      fi
      pnpm --filter "backgold-template-$TEMPLATE" exec wrangler deploy --dispatch-namespace "$namespace"

